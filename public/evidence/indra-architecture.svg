<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="gradPayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gradRelay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="gradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gradMerchant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Header -->
  <text x="40" y="45" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="-0.02em">PROJECT INDRA: OFFLINE PAYMENT RELAY ARCHITECTURE</text>
  <text x="40" y="70" fill="#94a3b8" font-size="12" font-weight="500">Operation अनुबंध (Anubandha) Topology: Offline Payer → Untrusted Online Relay → Mock NPCI → Offline Collector</text>
  <line x1="40" y1="85" x2="1160" y2="85" stroke="#334155" stroke-width="1.5" />

  <!-- ZONE LABELS -->
  <rect x="40" y="100" width="310" height="420" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
  <text x="55" y="125" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.05em">ZONE 1: OFFLINE PAYER DOMAIN</text>
  <text x="55" y="142" fill="#64748b" font-size="10">Air-gapped from WAN | Cellular &amp; Wi-Fi Disabled</text>

  <rect x="380" y="100" width="360" height="420" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
  <text x="395" y="125" fill="#60a5fa" font-size="11" font-weight="700" letter-spacing="0.05em">ZONE 2: UNTRUSTED RELAY MESH</text>
  <text x="395" y="142" fill="#64748b" font-size="10">Active WAN Uplink | Opaque / Encrypted Transit</text>

  <rect x="770" y="100" width="390" height="420" rx="8" fill="#1e293b" fill-opacity="0.4" stroke="#475569" stroke-width="1" stroke-dasharray="4 4" />
  <text x="785" y="125" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="0.05em">ZONE 3: SETTLEMENT AUTHORITY</text>
  <text x="785" y="142" fill="#64748b" font-size="10">Simulated NPCI Switch | In-Process Ledger</text>

  <!-- NODE A: PAYER -->
  <g filter="url(#shadow)">
    <rect x="60" y="170" width="270" height="320" rx="6" fill="url(#gradPayer)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="80" y="200" fill="#f8fafc" font-size="14" font-weight="700">Device A: Payer Smartphone</text>
    <text x="80" y="218" fill="#94a3b8" font-size="10" font-weight="600">Samsung Galaxy S24+ (Airplane Mode)</text>
    <line x1="80" y1="230" x2="310" y2="230" stroke="#334155" stroke-width="1" />

    <text x="80" y="255" fill="#cbd5e1" font-size="10.5">1. Optical QR Frame Capture</text>
    <text x="95" y="270" fill="#64748b" font-size="9.5">Decodes merchant routing address locally</text>

    <text x="80" y="295" fill="#cbd5e1" font-size="10.5">2. Local PIN / KeyStore Unlock</text>
    <text x="95" y="310" fill="#64748b" font-size="9.5">PBKDF2/Argon2 unlocks Ed25519 signing key</text>

    <text x="80" y="335" fill="#cbd5e1" font-size="10.5">3. PaymentIntent Generation</text>
    <text x="95" y="350" fill="#64748b" font-size="9.5">• 16-Byte Unique Nonce ID</text>
    <text x="95" y="365" fill="#64748b" font-size="9.5">• Timestamp + 300s TTL Window</text>
    <text x="95" y="380" fill="#64748b" font-size="9.5">• Simulated HSM Ciphertext Payload</text>
    <text x="95" y="395" fill="#64748b" font-size="9.5">• Ed25519 Digital Signature</text>

    <rect x="75" y="420" width="240" height="50" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="85" y="440" fill="#38bdf8" font-size="9.5" font-weight="600">PAYLOAD ENVELOPE (OPAQUE)</text>
    <text x="85" y="456" fill="#94a3b8" font-size="8.5">High-entropy ciphertext; zero plaintext leak</text>
  </g>

  <!-- NODE C: RELAY -->
  <g filter="url(#shadow)">
    <rect x="400" y="170" width="320" height="320" rx="6" fill="url(#gradRelay)" stroke="#60a5fa" stroke-width="1.5" />
    <text x="420" y="200" fill="#f8fafc" font-size="14" font-weight="700">Node C: Intermediary Relay</text>
    <text x="420" y="218" fill="#93c5fd" font-size="10" font-weight="600">Samsung Galaxy S25 FE / Laptop Workstation</text>
    <line x1="420" y1="230" x2="700" y2="230" stroke="#1e40af" stroke-width="1" />

    <text x="420" y="255" fill="#e0e7ff" font-size="10.5">1. Unprivileged Local Ingestion</text>
    <text x="435" y="270" fill="#93c5fd" font-size="9.5">Accepts opaque bundle over local radio/socket</text>

    <text x="420" y="295" fill="#e0e7ff" font-size="10.5">2. Opaque Relay Custody</text>
    <text x="435" y="310" fill="#93c5fd" font-size="9.5">Signs custody receipt (holds 0 payer secrets)</text>

    <text x="420" y="335" fill="#e0e7ff" font-size="10.5">3. WAN Egress Forwarding</text>
    <text x="435" y="350" fill="#93c5fd" font-size="9.5">Forwards untouched envelope to Mock NPCI</text>

    <rect x="415" y="375" width="290" height="95" rx="4" fill="#0f172a" stroke="#2563eb" stroke-width="1" />
    <text x="425" y="395" fill="#60a5fa" font-size="10" font-weight="700">DYNAMIC RELAY FAILOVER SUITE</text>
    <text x="425" y="413" fill="#cbd5e1" font-size="9">• Primary severance mid-flight tested</text>
    <text x="425" y="429" fill="#cbd5e1" font-size="9">• Auto-rerouting to secondary standby node</text>
    <text x="425" y="445" fill="#34d399" font-size="9" font-weight="600">✓ Result: Zero fund loss, zero double-debit</text>
  </g>

  <!-- NODE SWITCH: MOCK NPCI -->
  <g filter="url(#shadow)">
    <rect x="790" y="170" width="350" height="320" rx="6" fill="url(#gradAuth)" stroke="#c084fc" stroke-width="1.5" />
    <text x="810" y="200" fill="#f8fafc" font-size="14" font-weight="700">Mock NPCI Settlement Switch</text>
    <text x="810" y="218" fill="#d8b4fe" font-size="10" font-weight="600">Simulated Central Clearinghouse Authority</text>
    <line x1="810" y1="230" x2="1120" y2="230" stroke="#4338ca" stroke-width="1" />

    <text x="810" y="255" fill="#f3e8ff" font-size="10.5">1. Payer Signature Verification</text>
    <text x="825" y="270" fill="#d8b4fe" font-size="9.5">Validates Ed25519 signature against registered PK</text>

    <text x="810" y="295" fill="#f3e8ff" font-size="10.5">2. Validity Window Enforcement</text>
    <text x="825" y="310" fill="#d8b4fe" font-size="9.5">Asserts: T_now - T_intent &lt;= 300 seconds</text>

    <text x="810" y="335" fill="#f3e8ff" font-size="10.5">3. 16-Byte Deduplication Index</text>
    <text x="825" y="350" fill="#d8b4fe" font-size="9.5">Traps and rejects replayed or duplicate nonces</text>

    <text x="810" y="375" fill="#f3e8ff" font-size="10.5">4. Simulated Settlement Commit</text>
    <text x="825" y="390" fill="#d8b4fe" font-size="9.5">Records credit/debit in in-memory ledger</text>

    <rect x="805" y="415" width="320" height="55" rx="4" fill="#0f172a" stroke="#7e22ce" stroke-width="1" />
    <text x="815" y="435" fill="#c084fc" font-size="9.5" font-weight="600">SETTLEMENT CONFIRMATION</text>
    <text x="815" y="453" fill="#94a3b8" font-size="8.5">Ed25519 Counter-Signed Receipt issued to Merchant</text>
  </g>

  <!-- ARROWS & DATA FLOWS -->
  <line x1="330" y1="280" x2="400" y2="280" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="345" y="270" fill="#38bdf8" font-size="8.5" font-weight="700">HOP 1 (LOCAL)</text>

  <line x1="720" y1="280" x2="790" y2="280" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="735" y="270" fill="#60a5fa" font-size="8.5" font-weight="700">HOP 2 (WAN)</text>

  <!-- RETURN PATH TO MERCHANT -->
  <rect x="40" y="550" width="1120" height="190" rx="8" fill="#064e3b" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" />
  <text x="60" y="580" fill="#34d399" font-size="14" font-weight="800">HOP 3 (RETURN): OFFLINE MERCHANT COMMIT (Device B — Samsung Galaxy S25 Ultra)</text>
  <text x="60" y="598" fill="#94a3b8" font-size="10">Air-gapped from WAN | Receives Relayed SettlementConfirmation via Local Radio</text>

  <g transform="translate(60, 615)">
    <rect x="0" y="0" width="310" height="95" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="15" y="25" fill="#6ee7b7" font-size="11" font-weight="700">Authority Signature Verification</text>
    <text x="15" y="45" fill="#a7f3d0" font-size="9.5">Verifies Mock NPCI root Ed25519 signature.</text>
    <text x="15" y="62" fill="#a7f3d0" font-size="9.5">Traps forged confirmations fail-stop.</text>
    <text x="15" y="80" fill="#34d399" font-size="9.5" font-weight="600">✓ Cryptographically Non-Repudiable</text>
  </g>

  <g transform="translate(410, 615)">
    <rect x="0" y="0" width="310" height="95" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="15" y="25" fill="#6ee7b7" font-size="11" font-weight="700">Local Disk Persistence (SQLite WAL)</text>
    <text x="15" y="45" fill="#a7f3d0" font-size="9.5">Durably commits settlement to local disk.</text>
    <text x="15" y="62" fill="#a7f3d0" font-size="9.5">Measured WAL commit latency: 0.06 ms.</text>
    <text x="15" y="80" fill="#34d399" font-size="9.5" font-weight="600">✓ Atomic Commit Invariant Upheld</text>
  </g>

  <g transform="translate(760, 615)">
    <rect x="0" y="0" width="340" height="95" rx="5" fill="#022c22" stroke="#10b981" stroke-width="1" />
    <text x="15" y="25" fill="#6ee7b7" font-size="11" font-weight="700">Radix-16 Merkle DAG Advancement</text>
    <text x="15" y="45" fill="#a7f3d0" font-size="9.5">Advances prefix-trie Merkle DAG root.</text>
    <text x="15" y="62" fill="#a7f3d0" font-size="9.5">Renders green confirmation UI with audio chime.</text>
    <text x="15" y="80" fill="#34d399" font-size="9.5" font-weight="600">✓ Deterministic State Convergence</text>
  </g>

  <!-- Return Flow Arrow -->
  <path d="M 965 490 L 965 525 L 560 525 L 560 550" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowGreen)" />
  <text x="680" y="520" fill="#34d399" font-size="9" font-weight="700">RELAYED SETTLEMENT CONFIRMATION</text>
</svg>
